<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="theme-color" content="#128c3a">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Naija Dash</title>
<style>
:root{--ink:#08131d;--text:#fff;--gold:#f5b800;--grn:#1f8f4e;--panel:rgba(8,19,29,.8);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--ink:#08131d;--text:#fff;--gold:#f5b800;--grn:#1f8f4e;--panel:rgba(8,19,29,.8)}}
html{height:100%}body{margin:0;height:100%;background:var(--ink);color:var(--text);font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.p{background:var(--panel);border-radius:12px;padding:7px 11px;line-height:1.25}
button{font:inherit;color:var(--text);border:0;cursor:pointer}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}
#top button{pointer-events:auto}
#b{font-size:24px;color:var(--gold)}
.bar{height:7px;border-radius:4px;background:#ffffff30;margin-top:4px;overflow:hidden;width:96px}.bar i{display:block;height:100%;background:#ff5a4d;width:0}
#ar{font-size:26px;color:var(--gold);display:inline-block}
#msg{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 130px);max-width:calc(100vw - 100px);text-align:center;pointer-events:none}
#ctl{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#wh{width:128px;height:128px;border-radius:50%;border:10px solid #1c2733;background:radial-gradient(circle,#2b3947 0 22%,transparent 23%),conic-gradient(#cfd8de 0 4%,transparent 4% 46%,#cfd8de 46% 54%,transparent 54% 96%,#cfd8de 96%);pointer-events:auto;touch-action:none}
#ped{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.pd{width:78px;height:112px;border-radius:14px;font-weight:800;touch-action:none}#gas{background:var(--grn)}#brk{background:#c23b32;height:92px}
#card,#tc{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,370px);max-height:92vh;overflow:auto;text-align:center;background:var(--panel);border-radius:18px;padding:18px;backdrop-filter:blur(6px)}
#card h1,#tc h1{margin:0;font-size:25px;color:var(--gold);letter-spacing:.5px}#card p,#tc p{white-space:pre-line;margin:6px 0;color:#cfe0ea;font-weight:500}
.g{background:linear-gradient(90deg,#128c3a 33%,#fff 33% 66%,#128c3a 66%);height:5px;border-radius:3px;margin:8px 0}
.bt{display:block;width:100%;margin:8px 0 0;padding:13px;border-radius:12px;background:var(--grn);font-weight:800;font-size:16px}.bt.y{background:var(--gold);color:#201600}
#gar{display:flex;gap:6px;align-items:center;margin-top:8px}#gar button{background:#ffffff22;border-radius:10px;padding:10px 12px}#cn{flex:1;background:#ffffff14;border-radius:10px;padding:8px}
.bt.p2{background:#6a2c91}#wsh{position:fixed;inset:0;pointer-events:none;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);background:radial-gradient(circle at 20% 30%,#ffffff44 0 3px,transparent 4px),radial-gradient(circle at 70% 55%,#ffffff44 0 4px,transparent 5px),radial-gradient(circle at 45% 75%,#ffffff44 0 3px,transparent 4px),#ffffff12}#c2{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 200px);display:flex;flex-direction:column;gap:5px}#c2 button{width:46px;height:36px;font-size:18px;padding:0}#c2 .on{outline:2px solid var(--gold);background:#5a4300}.bt.w{background:#fff;color:#0a3d1c}.lb{display:flex;justify-content:space-between;padding:5px 9px;border-radius:8px;font-weight:600;text-align:left}.lb.me{background:#f5b80033;color:var(--gold)}.lb small{color:#9fc7a8}
.hide{display:none!important}
</style>




















<style id="naija-architecture-fix">
  /* Canvas sits at the bottom layer and never blocks clicks/touches */
  canvas#c {
    position: fixed !important;
    inset: 0 !important;
    z-index: 1 !important;
    pointer-events: none !important;
  }

  /* All UI overlays, cards, modals, and buttons sit securely on top and capture clicks */
  #card, #tc, #streakModal, #rev, #adv, #top, #ctl, .menu-overlay, button, .bt, [id*="Btn"], [id*="b"] {
    position: relative;
    z-index: 999999 !important;
    pointer-events: auto !important;
    touch-action: manipulation !important;
    cursor: pointer !important;
  }

  /* Ensure driving controls maintain touch capability during gameplay */
  #wh, #ped, #gas, #brk {
    pointer-events: auto !important;
    touch-action: none !important;
  }
</style>

<script id="naija-architecture-script">
// Force-check pointer events on every DOM mutation or menu toggle
setInterval(function() {
  var canvas = document.getElementById("c");
  if (canvas) {
    canvas.style.pointerEvents = "none";
  }
  
  // Ensure all buttons are clickable
  var interactiveElements = document.querySelectorAll("button, .bt, [id*='Btn'], [id*='b']");
  interactiveElements.forEach(function(el) {
    el.style.pointerEvents = "auto";
  });
}, 200);
</script>

</body></html>
