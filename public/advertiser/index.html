<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Naija Dash Advertiser Portal</title>
<style>
:root{--bg:#0e1a24;--panel:#162634;--line:#ffffff22;--green:#1f8f4e;--gold:#f2b800;--txt:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,Arial,sans-serif}
.w{max-width:720px;margin:0 auto;padding:12px}h1{font-size:20px;margin:0}h2{font-size:17px;margin:14px 0 8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
button{background:#2b3947;color:#fff;border:0;border-radius:10px;padding:10px 14px;font:600 14px system-ui;cursor:pointer}button.g{background:var(--green)}button.y{background:var(--gold);color:#222}
input,select{width:100%;padding:10px;border-radius:10px;border:0;font:16px system-ui;margin:3px 0 8px;background:#fff;color:#111}label{font-size:12px;opacity:.85}
.card{background:var(--panel);border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#ffffff22}.chip.live{background:var(--green)}.chip.ended{background:#555}.chip.paused{background:#8a6d00}
.msg{min-height:20px;font-size:13px;color:var(--gold)}.hide{display:none!important}.mut{opacity:.75;font-size:12px}
.bars div{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}.bars i{display:block;height:10px;background:var(--green);border-radius:5px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}canvas{width:100%;max-width:384px;border-radius:8px;display:block;margin:6px 0}
</style></head><body>
<div id="login" class="w hide"><h1>Naija Dash Advertiser Portal</h1><div class="card"><label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><div class="row"><button class="g" id="lgo">Sign in</button><button id="lgg">Sign in with Google</button></div><div id="lmsg" class="msg"></div><div class="mut">Use the same email you gave us. New here? Ask your Naija Dash contact to set up your access.</div></div></div>
<div id="app" class="hide"><div class="bar"><div><h1 id="adn">Advertiser</h1><div id="who" class="mut"></div></div><button id="out" style="padding:4px 10px;font-size:12px">Sign out</button></div>
<div class="w"><div id="list"></div><div id="rep" class="hide"></div><div id="gmsg" class="msg"></div></div></div>
<script>
(function(){
var C=window.NAIJA_CONFIG||{},U=C.SUPABASE_URL||'https://gilqteqdtwehwrqyapae.supabase.co',K=C.SUPABASE_ANON_KEY||'sb_publishable_eMOnlOA3gXljbwcSpKW-vg_ldYa-hfD';
var $=function(i){return document.getElementById(i)},S=null,camps=[],advName='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ld(){try{S=JSON.parse(localStorage.getItem('adv_auth'))}catch(e){S=null}}
function st(x){S=x;try{if(x)localStorage.setItem('adv_auth',JSON.stringify(x));else localStorage.removeItem('adv_auth')}catch(e){}}
function post(p,b){return fetch(U+p,{method:'POST',headers:{apikey:K,'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}},function(){return{ok:r.ok,j:{}}})})}
function norm(d){return d&&d.access_token?{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600)}:null}
function tok(){if(!S)return Promise.resolve(null);if(S.expires_at-60>Date.now()/1000)return Promise.resolve(S.access_token);return post('/auth/v1/token?grant_type=refresh_token',{refresh_token:S.refresh_token}).then(function(r){var n=r.ok?norm(r.j):null;if(n){st(n);return n.access_token}st(null);return null})}
function api(path){return tok().then(function(t){if(!t)return{s:401,j:{}};return fetch(path,{headers:{authorization:'Bearer '+t}}).then(function(r){return r.json().then(function(j){return{s:r.status,j:j}},function(){return{s:r.status,j:{}}})})}).catch(function(){return{s:0,j:{}}})}
function show(id){['login','app'].forEach(function(x){$(x).classList.toggle('hide',x!==id)})}
function boot(){var h=location.hash;if(h.indexOf('access_token=')>-1){var p=new URLSearchParams(h.slice(1));st({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:Math.floor(Date.now()/1000)+(+p.get('expires_in')||3600)});history.replaceState(null,'',location.pathname)}
ld();if(!S){show('login');return}
api('/api/advertiser/me').then(function(r){if(r.s!==200){show('login');$('lmsg').textContent=r.s===403?'This email has no advertiser access yet. Please contact Naija Dash.':'Please sign in.';if(r.s===401||r.s===403)st(null);return}advName=r.j.advertiser;$('adn').textContent=r.j.advertiser;$('who').textContent=r.j.email;camps=r.j.campaigns;show('app');list()})}
$('lgo').onclick=function(){var e=$('le').value.trim(),p=$('lp').value;if(!e||!p){$('lmsg').textContent='Enter your email and password.';return}$('lmsg').textContent='Please wait...';post('/auth/v1/token?grant_type=password',{email:e,password:p}).then(function(r){var n=r.ok?norm(r.j):null;if(!n){$('lmsg').textContent='Wrong email or password.';return}st(n);$('lmsg').textContent='';boot()}).catch(function(){$('lmsg').textContent='No connection.'})};
$('lgg').onclick=function(){location.href=U+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+'/advertiser/')};
$('out').onclick=function(){st(null);show('login')};
function draw(cv,lines,c1,c2){var x=cv.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,256,128);x.fillStyle=c2;x.fillRect(0,0,256,10);x.fillRect(0,118,256,10);x.font='800 32px system-ui,Arial';x.textAlign='center';x.fillText(String(lines[0]||''),128,58,236);x.font='800 24px system-ui,Arial';x.fillText(String(lines[1]||''),128,96,236);x.font='700 12px system-ui,Arial';x.textAlign='left';x.fillText('AD',8,28)}
function exportPdf(c,j,days){
  var cv=document.createElement('canvas');cv.width=512;cv.height=256;
  var x=cv.getContext('2d');x.scale(2,2);draw({getContext:function(){return x}},c.lines||['',''],c.c1||'#128c3a',c.c2||'#ffffff');
  var img=cv.toDataURL('image/png'),vtr=j.served?((j.views/j.served)*100).toFixed(1)+'%':'0.0%';
  var w=window.open('','_blank');if(!w){alert('Please allow pop-ups to export the PDF report.');return}
  var html='<!doctype html><html><head><meta charset="utf-8"><title>Naija Dash Report - '+esc(advName)+'</title><style>body{font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111;margin:0;padding:28px;max-width:820px;margin:0 auto}.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #128c3a;padding-bottom:14px;margin-bottom:20px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.kpi{border:1px solid #d0d7de;border-radius:10px;padding:12px;background:#f8fafc}.kpi small{color:#555;font-size:12px;display:block}.kpi b{font-size:24px;color:#0e1a24}table{width:100%;border-collapse:collapse;margin:12px 0 22px;font-size:13px}th,td{border-bottom:1px solid #e1e4e8;padding:8px 6px;text-align:left}th{background:#f1f5f9;font-weight:700}.bb{display:flex;gap:18px;align-items:center;background:#f8fafc;border:1px solid #d0d7de;border-radius:12px;padding:14px;margin-bottom:18px}.bb img{width:240px;height:120px;border-radius:8px;border:1px solid #ccc}@media print{.noprint{display:none!important}body{padding:10px}}</style></head><body>';
  html+='<div class="noprint" style="margin-bottom:16px;text-align:right"><button onclick="window.print()" style="background:#128c3a;color:#fff;border:0;padding:10px 18px;border-radius:8px;font:700 14px system-ui;cursor:pointer">🖨 Save / Print as PDF</button></div>';
  html+='<div class="hdr"><div><h1 style="margin:0;color:#128c3a;font-size:24px">NAIJA DASH · SPONSOR REPORT</h1><div style="color:#555">Advertiser: <b>'+esc(advName)+'</b> · Generated '+new Date().toISOString().slice(0,10)+'</div></div><div style="text-align:right;font-size:12px;color:#555">app.naijadash.com<br>Report window: Last '+days+' days</div></div>';
  html+='<div class="bb"><img src="'+img+'"><div><h2 style="margin:0 0 6px">'+esc((c.lines||[]).join(' / '))+'</h2><div><b>Status:</b> '+esc(c.status)+' · <b>Type:</b> '+esc(c.type)+'</div><div><b>Flight dates:</b> '+esc(c.start_date)+' to '+esc(c.end_date)+'</div><div><b>Target cities:</b> '+esc((c.cities&&c.cities.length)?c.cities.join(', '):'All 5 cities (Lagos, Abuja, Port Harcourt, Kano, Enugu)')+'</div></div></div>';
  html+='<div class="kpis"><div class="kpi"><small>Verified Views (1s+)</small><b>'+j.views.toLocaleString()+'</b></div><div class="kpi"><small>Unique Players</small><b>'+j.unique.toLocaleString()+'</b></div><div class="kpi"><small>Billboards Served</small><b>'+j.served.toLocaleString()+'</b></div><div class="kpi"><small>Viewability Rate</small><b>'+vtr+'</b></div></div>';
  html+='<h3>Performance by City</h3><table><tr><th>City</th><th>Verified Views</th><th>Billboards Served</th><th>View Rate</th></tr>'+(j.by_city.length?j.by_city.map(function(x){var r2=x.served?((x.views/x.served)*100).toFixed(1)+'%':'0.0%';return '<tr><td>'+esc(x.city)+'</td><td>'+x.views.toLocaleString()+'</td><td>'+x.served.toLocaleString()+'</td><td>'+r2+'</td></tr>'}).join(''):'<tr><td colspan="4">No city activity recorded in this period.</td></tr>')+'</table>';
  html+='<h3>Daily Performance Log</h3><table><tr><th>Date</th><th>Verified Views</th><th>Unique Players</th><th>Billboards Served</th></tr>'+(j.by_day.length?j.by_day.map(function(d){return '<tr><td>'+esc(d.day)+'</td><td>'+d.views.toLocaleString()+'</td><td>'+d.unique.toLocaleString()+'</td><td>'+d.served.toLocaleString()+'</td></tr>'}).join(''):'<tr><td colspan="4">No daily activity recorded in this period.</td></tr>')+'</table>';
  html+='<div style="font-size:11px;color:#666;border-top:1px solid #ddd;padding-top:10px">Methodology: A Served count is recorded when a campaign billboard is placed into a city run. A Verified View requires the billboard to stay inside the player\u2019s camera view within 45m for at least 1 continuous second. Unique Players counts distinct anonymous device hashes per day.</div>';
  html+='<script>setTimeout(function(){window.print()},350);<\/script></body></html>';
  w.document.open();w.document.write(html);w.document.close();
}
function list(){$('rep').classList.add('hide');$('list').classList.remove('hide');var h='<h2>Your campaigns</h2>';if(!camps.length)h+='<div class="card mut">No campaigns are linked to your account yet.</div>';
camps.forEach(function(c){h+='<div class="card"><div class="row" style="align-items:center"><b>'+esc((c.lines||[]).join(' / '))+'</b><span style="text-align:right"><span class="chip '+esc(c.status)+'">'+esc(c.status)+'</span></span></div><div class="mut">'+esc(c.start_date)+' to '+esc(c.end_date)+' \u00b7 '+esc((c.cities&&c.cities.length)?c.cities.join(', '):'All cities')+'</div><div style="margin:4px 0"><b>'+c.views+'</b> views \u00b7 '+c.served+' served</div><canvas width="256" height="128" data-c="'+esc(c.id)+'"></canvas><button class="g" data-r="'+esc(c.id)+'">View report & export PDF</button></div>'});
$('list').innerHTML=h;Array.prototype.forEach.call($('list').querySelectorAll('canvas'),function(cv){var c=camps.filter(function(x){return x.id===cv.getAttribute('data-c')})[0];draw(cv,c.lines,c.c1,c.c2)});
Array.prototype.forEach.call($('list').querySelectorAll('button[data-r]'),function(b){b.onclick=function(){report(b.getAttribute('data-r'),30)}})}
function report(id,days){$('gmsg').textContent='Loading...';api('/api/advertiser/stats?campaign='+encodeURIComponent(id)+'&days='+days).then(function(r){$('gmsg').textContent='';if(r.s!==200){$('gmsg').textContent='Could not load the report.';return}var j=r.j,mx=1;j.by_day.forEach(function(d){mx=Math.max(mx,d.views)});var c=camps.filter(function(x){return x.id===id})[0];
var h='<div class="row" style="align-items:center"><button id="back" style="flex:0 0 auto">← Back</button><select id="rdays" style="flex:1;margin:0"><option value="7"'+(days===7?' selected':'')+'>Last 7 days</option><option value="30"'+(days===30?' selected':'')+'>Last 30 days</option><option value="90"'+(days===90?' selected':'')+'>Last 90 days</option></select></div><h2>'+esc((c.lines||[]).join(' / '))+'</h2><div class="card"><div class="row"><div><div class="mut">Views</div><div style="font-size:28px;font-weight:700">'+j.views+'</div></div><div><div class="mut">Unique players</div><div style="font-size:28px;font-weight:700">'+j.unique+'</div></div><div><div class="mut">Served</div><div style="font-size:28px;font-weight:700">'+j.served+'</div></div></div><div class="mut">Last '+days+' days. A view means your billboard was on screen for at least one second. Unique players is approximate: one per phone and browser.</div></div>';
h+='<div class="card"><b>By day</b><div class="bars">'+(j.by_day.length?j.by_day.map(function(d){return '<div><span style="width:78px">'+esc(d.day.slice(5))+'</span><i style="width:'+Math.round(100*d.views/mx)+'%"></i><span>'+d.views+' views \u00b7 '+d.unique+' unique</span></div>'}).join(''):'<span class="mut">No data yet.</span>')+'</div></div>';
h+='<div class="card"><b>By city</b><table><tr><th>City</th><th>Views</th><th>Served</th></tr>'+j.by_city.map(function(x){return '<tr><td>'+esc(x.city)+'</td><td>'+x.views+'</td><td>'+x.served+'</td></tr>'}).join('')+'</table></div><div class="row"><button class="y" id="pdf">📄 Download PDF Report</button><button id="csv">⬇ Download CSV</button></div>';
$('list').classList.add('hide');$('rep').classList.remove('hide');$('rep').innerHTML=h;$('back').onclick=list;
$('rdays').onchange=function(){report(id,Number($('rdays').value)||30)};
$('pdf').onclick=function(){exportPdf(c,j,days)};
$('csv').onclick=function(){var t='day,served,views,unique\n'+j.by_day.map(function(d){return d.day+','+d.served+','+d.views+','+d.unique}).join('\n'),a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(t);a.download='report-'+id+'.csv';document.body.appendChild(a);a.click();a.remove()}})}
boot();
})();
</script></body></html>
